<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="app-build" content="20260902132619">
<title>Ecotuned CA Tracker</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --sub:#6e6e73;
    --green:#34c759; --red:#ff3b30; --blue:#007aff; --amber:#ff9500; --purple:#af52de;
    --sep:#e5e5ea; --chip:#e9e9ec;
    color-scheme: light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior-y:none;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  header{
    padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;
    background:rgba(242,242,247,0.92); backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:20; border-bottom:1px solid var(--sep);
  }
  header .titlerow{display:flex; justify-content:space-between; align-items:flex-start;}
  header .titlewrap{display:flex; align-items:center; gap:10px;}
  header .applogo{width:38px; height:38px; border-radius:10px; object-fit:cover; flex-shrink:0;
    box-shadow:0 1px 3px rgba(0,0,0,.2);}
  header h1{font-size:22px;margin:0 0 2px;font-weight:700;letter-spacing:-0.3px;}
  header .sub{font-size:13px;color:var(--sub);margin:0 0 10px;}
  #refreshBtn{background:var(--chip); border:none; width:32px;height:32px;border-radius:50%;
    font-size:15px; color:var(--blue); font-family:inherit; flex-shrink:0;}
  #refreshBtn.spinning{animation:spin 0.8s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  #syncline{font-size:11px;color:var(--sub);margin:-6px 0 8px;}
  #syncline.err{color:var(--red);}

  .stats{display:flex; gap:8px; margin-bottom:10px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .stat{flex:1; min-width:74px; background:var(--card); border-radius:12px; padding:8px 10px; text-align:center;}
  .stat .n{font-size:18px;font-weight:700;}
  .stat .l{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.3px;}

  .segmented{display:flex; background:var(--chip); border-radius:9px; padding:2px; margin-bottom:8px;}
  .segmented button{flex:1; border:none; background:transparent; padding:6px 4px; font-size:13px;
    font-weight:600; color:var(--text); border-radius:7px; font-family:inherit;}
  .segmented button.active{background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.15);}

  .searchbar{position:relative; margin-bottom:8px;}
  .searchbar input{width:100%; border:none; background:var(--chip); border-radius:10px;
    padding:9px 12px 9px 32px; font-size:15px; font-family:inherit;}
  .searchbar input:focus{outline:2px solid var(--blue);}
  .searchbar .icon{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--sub); font-size:14px;}

  .filters{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px;}
  .filters::-webkit-scrollbar{display:none;}
  .chipgroup{display:flex; gap:6px; flex-shrink:0;}
  .chip{flex-shrink:0; font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:14px;
    background:var(--chip); color:var(--text); border:none; white-space:nowrap; font-family:inherit;}
  .chip.active{background:var(--blue); color:#fff;}
  .chip.status-up.active{background:var(--green);}
  .chip.status-down.active{background:var(--red);}
  .chip.gen-mk3.active{background:#2563eb;}
  .chip.gen-mk4.active{background:#7c3aed;}

  .gentag{display:inline-block; font-size:10px; font-weight:700; padding:2px 6px; border-radius:6px;
    vertical-align:middle; letter-spacing:.2px;}
  .gentag.mk3{background:#dbeafe; color:#1e40af;}
  .gentag.mk4{background:#ede9fe; color:#6b21a8;}

  .swversions{display:flex; flex-wrap:wrap; gap:6px;}
  .swver{display:inline-flex; align-items:baseline; gap:4px; font-size:12px; color:var(--sub);
    background:var(--chip-bg,#f1f5f9); padding:3px 8px; border-radius:8px;}
  .swver b{font-size:12px; color:var(--text,#111827); font-weight:700;}
  .swver.latest{background:rgba(52,199,89,0.14); color:#1a7a34;}
  .swver.latest b{color:#1a7a34;}

  .history-list{display:flex; flex-direction:column; gap:6px;}
  .history-link{display:block; background:var(--bg); border-radius:8px; padding:8px 10px; text-decoration:none;}
  .history-case{display:block; font-size:12.5px; font-weight:700; color:var(--blue);}
  .history-complaint{display:block; font-size:12.5px; color:var(--sub); margin-top:2px; line-height:1.3;}

  main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 16px calc(env(safe-area-inset-bottom) + 16px);}
  .pull-indicator{height:0; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:6px;
    color:var(--sub); font-size:12.5px; font-weight:600; transition:height .15s ease;}
  .pull-indicator .pull-spinner{display:inline-block; font-size:14px; transition:transform .15s ease;}
  .pull-indicator.armed .pull-spinner{transform:rotate(180deg);}
  .pull-indicator.refreshing .pull-spinner{animation:spin 0.8s linear infinite; transform:none;}
  #listInner{padding-top:10px;}
  .empty{text-align:center; color:var(--sub); margin-top:60px; font-size:14px;}
  .loading{text-align:center; color:var(--sub); margin-top:60px; font-size:14px;}

  .card-wrap{position:relative; margin-bottom:10px; border-radius:14px; overflow:hidden;}
  .card-delete-bg{position:absolute; inset:0; background:var(--red); display:flex; align-items:stretch; justify-content:flex-end;}
  .card-delete-btn{background:none; border:none; color:#fff; font-size:13px; font-weight:700;
    padding:0 20px; font-family:inherit; white-space:nowrap;}
  .card{background:var(--card); border-radius:14px; padding:12px 14px;
    box-shadow:0 1px 2px rgba(0,0,0,.06); position:relative; touch-action:pan-y;}
  .card .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card .idline{font-size:12px; color:var(--sub); font-weight:600;}
  .card .bus{font-size:16px; font-weight:700; margin-top:1px;}
  .pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px; color:#fff; white-space:nowrap;}
  .pill.up{background:var(--green);}
  .pill.down{background:var(--red);}
  .pill.other{background:var(--sub);}
  .card .meta{font-size:12.5px; color:var(--sub); margin-top:4px;}
  .card .complaint{font-size:14px; margin-top:6px; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card .foot{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
  .techs{display:flex; gap:4px;}
  .tech{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;
    font-weight:700; display:flex; align-items:center; justify-content:center;}
  .tech.closed-tag{background:var(--sub);}
  .miles{font-size:11.5px; color:var(--sub);}

  #overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; opacity:0; pointer-events:none; transition:opacity .25s;}
  #overlay.show{opacity:1; pointer-events:auto;}
  #sheet{position:fixed; left:0; right:0; bottom:0; max-height:88vh; background:var(--card);
    border-radius:16px 16px 0 0; z-index:41; transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
    display:flex; flex-direction:column; box-shadow:0 -4px 24px rgba(0,0,0,.2);}
  #sheet.show{transform:translateY(0);}
  #sheet .handle{width:36px;height:5px;background:#d1d1d6;border-radius:3px;margin:8px auto 0;}
  #sheet .sheethead{padding:10px 18px 6px; display:flex; justify-content:space-between; align-items:flex-start;}
  #sheet .sheethead h2{font-size:19px;margin:0;}
  #sheet .sheethead .subid{font-size:12.5px;color:var(--sub);margin-top:2px;}
  .backbtn{display:block; background:none; border:none; padding:0; margin:0 0 4px; color:var(--blue);
    font-size:13px; font-weight:600; font-family:inherit;}
  #sheet .closebtn{background:var(--chip); border:none; width:28px;height:28px;border-radius:50%;
    font-size:15px; color:var(--sub); font-family:inherit;}
  #sheetbody{overflow-y:auto; padding:6px 18px calc(env(safe-area-inset-bottom) + 24px); -webkit-overflow-scrolling:touch;}
  .field{margin-top:14px;}
  .field .fl{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--sub); font-weight:700; margin-bottom:3px;}
  .field .fv{font-size:14.5px; line-height:1.45; white-space:pre-wrap;}
  .badgerow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .badge{font-size:12px; font-weight:600; padding:4px 10px; border-radius:8px; background:var(--chip);}
  .badge.tstatus-online{background:rgba(52,199,89,0.14); color:#1a7a34;}
  .badge.tstatus-offline{background:rgba(255,59,48,0.12); color:#b42318;}

  .notebox{margin-top:16px; background:var(--bg); border-radius:12px; padding:12px;}
  .notebox .fl{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--sub); font-weight:700; margin-bottom:6px;}
  .notebox input[type=text], .notebox textarea{width:100%; border:1px solid var(--sep); background:var(--card);
    border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; resize:vertical;}
  .notebox input[type=text]{margin-bottom:8px;}
  .notebox textarea{min-height:64px;}
  .notebox .noterow{display:flex; justify-content:flex-end; gap:8px; margin-top:8px; align-items:center;}
  .notebox .notemsg{font-size:12px; color:var(--sub); margin-right:auto;}
  .notebox .notemsg.err{color:var(--red);}
  .notebox .notemsg.ok{color:var(--green);}
  #addNoteBtn{background:var(--blue); color:#fff; border:none; padding:8px 16px; border-radius:8px;
    font-size:14px; font-weight:600; font-family:inherit;}
  #addNoteBtn:disabled{opacity:0.5;}

  .headerbtns{display:flex; align-items:center; flex-shrink:0; gap:8px;}
  #newCaseBtn{background:var(--chip); border:none; width:32px;height:32px;border-radius:50%;
    font-size:18px; color:var(--blue); font-family:inherit; flex-shrink:0; font-weight:700; line-height:1;}

  .statusbox{margin-top:16px; background:var(--bg); border-radius:12px; padding:12px;}
  .statusbox .fl{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--sub); font-weight:700; margin-bottom:6px;}
  .statusbox .row{display:flex; gap:8px; margin-bottom:8px;}
  .statusbox .row > div{flex:1;}
  .statusbox label{display:block; font-size:11px; color:var(--sub); margin-bottom:3px;}
  .statusbox select, .statusbox input[type=text], .statusbox textarea{width:100%; border:1px solid var(--sep); background:var(--card);
    border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit;}
  .statusbox textarea{min-height:60px; resize:vertical;}
  .statusbox .noterow{display:flex; justify-content:flex-end; gap:8px; margin-top:8px; align-items:center;}
  .closefields{margin-top:6px;}
  .closefields label{margin-top:8px;}
  .combo-wrap{position:relative;}
  .combo-list{position:absolute; z-index:60; left:0; right:0; top:calc(100% + 2px); background:var(--card);
    border:1px solid var(--sep); max-height:200px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    border-radius:8px; box-shadow:0 6px 16px rgba(0,0,0,.18); display:none;}
  .combo-list.show{display:block;}
  .combo-item{padding:9px 12px; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--sep);}
  .combo-item:last-child{border-bottom:none;}
  .combo-item:hover, .combo-item.hl{background:var(--bg);}
  .combo-item.empty{color:var(--sub); font-style:italic; cursor:default;}
  .combo-item.empty:hover{background:transparent;}
  #saveStatusBtn{background:var(--green); color:#fff; border:none; padding:8px 16px; border-radius:8px;
    font-size:14px; font-weight:600; font-family:inherit;}
  #saveStatusBtn:disabled{opacity:0.5;}

  .aibox{margin-top:16px; background:var(--bg); border-radius:12px; padding:12px;}
  .aibox .fl{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--purple); font-weight:700; margin-bottom:6px;}
  .aibox .notemsg{font-size:12px; color:var(--sub); margin-right:auto;}
  .aibox .notemsg.err{color:var(--red);}
  .aibox .notemsg.ok{color:var(--green);}
  .ai-log{display:flex; flex-direction:column; gap:8px; margin-bottom:8px;}
  .ai-msg{padding:9px 12px; border-radius:12px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word;}
  .ai-msg.user{background:var(--chip); align-self:flex-end; max-width:88%; border-bottom-right-radius:4px;}
  .ai-msg.assistant{background:var(--card); border:1px solid var(--sep); align-self:flex-start; max-width:94%; border-bottom-left-radius:4px;}
  .ai-msg.loading{color:var(--sub); font-style:italic; background:transparent; border:none; padding:2px 2px;}
  .ai-empty{font-size:12.5px; color:var(--sub); font-style:italic;}
  .ai-actions{display:flex; justify-content:flex-start;}
  #aiAnalyzeBtn{background:var(--purple); color:#fff; border:none; padding:8px 16px; border-radius:8px;
    font-size:14px; font-weight:600; font-family:inherit;}
  #aiAnalyzeBtn:disabled{opacity:0.5;}
  .ai-ask-row{display:flex; gap:8px; margin-top:10px;}
  .ai-ask-row input{flex:1; min-width:0; border:1px solid var(--sep); background:var(--card); border-radius:8px;
    padding:8px 10px; font-size:14px; font-family:inherit;}
  #aiAskBtn{background:var(--purple); color:#fff; border:none; padding:8px 14px; border-radius:8px;
    font-size:14px; font-weight:600; font-family:inherit; flex-shrink:0;}
  #aiAskBtn:disabled{opacity:0.5;}

  .newcaseform .fieldrow{margin-top:12px;}
  .newcaseform label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--sub); font-weight:700; margin-bottom:4px;}
  .newcaseform input[type=text], .newcaseform select, .newcaseform textarea{width:100%; border:1px solid var(--sep); background:var(--card);
    border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; resize:vertical;}
  .newcaseform textarea{min-height:60px;}
  .newcaseform .techrow{display:flex; gap:14px; margin-top:4px;}
  .newcaseform .techrow label{display:flex; align-items:center; gap:6px; font-size:13px; text-transform:none; font-weight:500; color:var(--text); margin-bottom:0;}
  .statusbox .techrow{display:flex; gap:14px; margin-top:4px; flex-wrap:wrap;}
  .statusbox .techrow label{display:flex; align-items:center; gap:6px; font-size:13px; text-transform:none; font-weight:500; color:var(--text); margin-bottom:0;}
  .newcaseform .submitrow{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; align-items:center;}
  .newcaseform .formmsg{font-size:12px; color:var(--sub); margin-right:auto;}
  .newcaseform .formmsg.err{color:var(--red);}
  .newcaseform .formmsg.ok{color:var(--green);}
  #createCaseBtn{background:var(--blue); color:#fff; border:none; padding:9px 18px; border-radius:8px;
    font-size:14px; font-weight:600; font-family:inherit;}
  #createCaseBtn:disabled{opacity:0.5;}

  .tip{font-size:11.5px; color:var(--sub); text-align:center; padding:6px 20px 2px;}

  .recallbanner{margin-top:4px; margin-bottom:4px; background:#fff4e5; border:1px solid var(--amber); border-radius:12px; padding:12px;}
  .recallbanner-title{font-size:13px; font-weight:700; color:#b25000; margin-bottom:4px;}
  .recallbanner-text{font-size:13px; color:var(--text); line-height:1.4;}
  .recallbanner-row{display:flex; justify-content:flex-end; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;}
  #recallVersionSelect{border:1px solid var(--amber); background:#fff; border-radius:8px; padding:7px 8px;
    font-size:13px; font-family:inherit;}
  #confirmRecallBtn{background:var(--amber); color:#fff; border:none; padding:8px 16px; border-radius:8px;
    font-size:14px; font-weight:600; font-family:inherit;}
  #confirmRecallBtn:disabled{opacity:0.5;}

  .warrantybanner{margin-top:4px; margin-bottom:4px; background:#fff4e5; border:1px solid var(--amber); border-radius:12px; padding:12px;}
  .warrantybanner-title{font-size:13px; font-weight:700; color:#b25000; margin-bottom:4px;}
  .warrantybanner-text{font-size:13px; color:var(--text); line-height:1.4; margin-top:2px;}
  .warrantybanner.expired{background:#ffe9e7; border-color:var(--red);}
  .warrantybanner.expired .warrantybanner-title{color:#b42318;}

  .photopicker{margin-top:8px;}
  .photobtn{background:var(--chip); color:var(--blue); border:none; padding:7px 12px; border-radius:8px;
    font-size:13px; font-weight:600; font-family:inherit;}
  .photopreview{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .photothumb{position:relative; width:64px; height:64px;}
  .photothumb img{width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid var(--sep);}
  .photoremove{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--red); color:#fff; border:none; font-size:11px; line-height:1; font-family:inherit; padding:0;}
  .notephoto{width:100px; max-width:100%; border-radius:8px; margin:4px 4px 0 0; display:inline-block;
    vertical-align:top; border:1px solid var(--sep);}
</style>
</head>
<body>
<div id="app">
  <header>

// iOS home-screen (standalone) PWAs aggressively cache the app shell (HTML/JS/CSS) and
// don't automatically pick up a new deploy just because the data refreshes. This checks
// the live page for a newer build id and force-reloads so new features/fixes actually show
// up without the user having to force-quit the app. Non-critical: any failure here is silent.
async function checkForUpdate(){
  try{
    const res = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const html = await res.text();
    const m = html.match(/name="app-build" content="([^"]+)"/);
    if(m && m[1] && m[1] !== APP_BUILD){
      location.reload();
    }
  } catch(e){ /* ignore, non-critical */ }
}

// Apps Script web apps occasionally return a transient 503 or drop the
// connection (cold start / infra hiccup). Retry once after a short delay
// before giving up, so a single blip doesn't surface as a user-facing error.
async function postToApi(body){
  const opts = { method: 'POST', body: JSON.stringify(body) };
  try{
    const res = await fetch(NOTES_API_URL, opts);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res;
  } catch(e){
    await new Promise(r => setTimeout(r, 1200));
    const res = await fetch(NOTES_API_URL, opts);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res;
  }
}

function norm(s){ return (s||'').toString().trim(); }
function normLower(s){ return norm(s).toLowerCase(); }

// Mileage is entered as free text ('45,120 mi', '13,951 km', etc). Always
// display it normalized to miles so units never get mixed in the UI.
const KM_TO_MI = 0.621371;
function formatMileage(raw){
  const s = norm(raw);
  if(!s) return '';
  const numMatch = s.replace(/,/g,'').match(/[\d.]+/);
  if(!numMatch) return s; // couldn't parse a number, show as-is rather than dropping it
  let val = parseFloat(numMatch[0]);
  if(/km/i.test(s)) val = val * KM_TO_MI;
  return Math.round(val).toLocaleString('en-US') + ' mi';
}

// Same parsing as formatMileage but returns a plain number (miles) for warranty math.
function parseMileageNum(raw){
  const s = norm(raw);
  if(!s) return null;
  const numMatch = s.replace(/,/g,'').match(/[\d.]+/);
  if(!numMatch) return null;
  let val = parseFloat(numMatch[0]);
  if(/km/i.test(s)) val = val * KM_TO_MI;
  return Math.round(val);
}

// Warranty rules: HV battery = 8yr / 100,000 mi; Powertrain = 5yr / 100,000 mi;
// whichever limit (date or mileage) is hit first ends coverage for that part.
const WARRANTY_MILEAGE_LIMIT = 100000;
const WARRANTY_WARN_DAYS = 30;

function parseWarrantyDate(s){
  s = norm(s);
  if(!s) return null;
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  let d;
  if(m) d = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  else d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function addYears(date, years){
  const d = new Date(date.getTime());
  d.setFullYear(d.getFullYear() + years);
  return d;
}

function daysBetween(a, b){
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

function computeWarrantyPart(warrantyStart, mileageNum, years){
  const expiryDate = addYears(warrantyStart, years);
  const today = new Date();
  today.setHours(0,0,0,0);
  const mileageExpired = (mileageNum != null && mileageNum >= WARRANTY_MILEAGE_LIMIT);
  const dateExpired = today.getTime() >= expiryDate.getTime();
  const expired = mileageExpired || dateExpired;
  const daysLeft = daysBetween(today, expiryDate);
  const expiringSoon = !expired && daysLeft >= 0 && daysLeft <= WARRANTY_WARN_DAYS;
  return { expired, expiringSoon, expiryDate, daysLeft, mileageExpired, dateExpired };
}

function computeWarrantyStatus(r){
  const warrantyStart = parseWarrantyDate(r.warrantyStart);
  if(!warrantyStart) return null;
  return {
    hv: computeWarrantyPart(warrantyStart, r.mileageNum, 8),
    powertrain: computeWarrantyPart(warrantyStart, r.mileageNum, 5)
  };
}

function fmtDate(d){
  return d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
}

function warrantyFieldHtml(status){
  if(!status) return '';
  const line = (label, s) => {
    let state;
    if(s.expired) state = 'Out of warranty (' + (s.mileageExpired ? 'mileage limit reached' : 'expired ' + fmtDate(s.expiryDate)) + ')';
    else if(s.expiringSoon) state = 'Expires in ' + s.daysLeft + ' day(s) &middot; ' + fmtDate(s.expiryDate);
    else state = 'Active until ' + fmtDate(s.expiryDate);
    return label + ': ' + state;
  };
  return '<div class="field"><div class="fl">Warranty</div><div class="fv">' + line('HV Battery (8yr/100k mi)', status.hv) + '<br>' + line('Powertrain (5yr/100k mi)', status.powertrain) + '</div></div>';
}

function warrantyBannerHtml(status, busLabel){
  if(!status) return '';
  const parts = [];
  [['hv','HV Battery'],['powertrain','Powertrain']].forEach(([key,label]) => {
    const s = status[key];
    if(s.expired){
      const reason = s.mileageExpired ? 'mileage limit (100,000 mi) reached' : ('expired ' + fmtDate(s.expiryDate));
      parts.push({ level:'expired', text: label + ' warranty is out (' + reason + '). This call might be billable.' });
    } else if(s.expiringSoon){
      parts.push({ level:'soon', text: label + ' warranty expires in ' + s.daysLeft + ' day(s) (' + fmtDate(s.expiryDate) + ').' });
    }
  });
  if(!parts.length) return '';
  const hasExpired = parts.some(p => p.level === 'expired');
  const cls = hasExpired ? 'expired' : '';
  const title = hasExpired ? '&#9888; Warranty Expired' : '&#9200; Warranty Expiring Soon';
  return '<div class="warrantybanner ' + cls + '"><div class="warrantybanner-title">' + title + '</div>' + parts.map(p => '<div class="warrantybanner-text">' + escapeHtml(p.text) + '</div>').join('') + '</div>';
}

// Minimal RFC4180-ish CSV parser (handles quoted fields, embedded commas/newlines, doubled quotes)
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function csvToObjects(text){
  const rows = parseCSV(text).filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
  if(rows.length === 0) return [];
  const headers = rows[0];
  return rows.slice(1).map((r, i) => {
    const obj = {};
    headers.forEach((h, j) => obj[h] = r[j] !== undefined ? r[j] : '');
    obj.__sheetRow = i + 2; // +1 for header row, +1 for 1-based indexing
    return obj;
  });
}

function makeRecord(r){
  const statusRaw = normLower(r['Status']);
  let status = 'other';
  if(statusRaw === 'up') status = 'up';
  else if(statusRaw === 'down') status = 'down';

  let loc = norm(r['ET Location']);
  loc = loc ? loc.charAt(0).toUpperCase() + loc.slice(1).toLowerCase() : 'Unknown';

  const techs = TECHS.filter(t => norm(r[t]) !== '');
  const bucket = normLower(r['Bucket']) === 'active' ? 'active' : 'closed';

  return {
    date: r['Date'] || '',
    customer: norm(r['Customer']) || 'Unknown',
    bus: norm(r['Bus #']) || String.fromCharCode(8212),
    caseNum: r['Case #'] || '',
    status, statusLabel: status === 'other' ? (norm(r['Status']) || String.fromCharCode(8212)) : (status.charAt(0).toUpperCase()+status.slice(1)),
    loc,
    techs,
    complaint: norm(r['Initial Complaint']),
    tasks: norm(r['Tasks']),
    notes: norm(r['Last update']),
    mileage: formatMileage(r['Mileage']),
    mileageNum: parseMileageNum(r['Mileage']),
    warrantyStart: norm(r['Warranty Start Date']),
    lastLocation: norm(r['Last Location']),
    generation: norm(r['Generation']),
    swInternal: norm(r['SW Internal']),
    swFront: norm(r['SW Front']),
    swRear: norm(r['SW Rear']),
    swScreen: norm(r['SW Screen']),
    swBuild: norm(r['SW Build']),
    telemetryStatus: norm(r['Telemetry Status']),
    lastTelemetry: norm(r['Last Telemetry Contact']),
    caseStatus: norm(r['Case status']),
    subAssembly: norm(r['Sub Assembly']),
    symptom: norm(r['Symptom']),
    component: norm(r['Component']),
    solution: norm(r['Solution']),
    rootCause: norm(r['Root Cause']),
    bucket,
    sheetRow: r.__sheetRow
  };
}

let RECORDS = [];
let RECALL_MAP = {};
const state = { seg:'active', search:'', loc:'all', status:'all', tech:'all', gen:'all' };

function buildRecordsFromCsv(text){
  const objs = csvToObjects(text);
  const recs = objs.filter(o => norm(o['Bus #']) || norm(o['Customer'])).map(makeRecord);
  recs.sort((a,b) => (b.date||'').localeCompare(a.date||'') || (String(b.caseNum)).localeCompare(String(a.caseNum)));
  return recs;
}

function setSync(msg, isErr){
  const el = document.getElementById('syncline');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
}

function buildRecallMap(text){
  const objs = csvToObjects(text);
  const map = {};
  objs.forEach(o => {
    const bus = norm(o['Bus #']);
    if(!bus) return;
    const dateVal = norm(o['Recall Date']);
    if(!map[bus]) map[bus] = { done: true };
    if(!dateVal) map[bus].done = false;
  });
  return map;
}

async function loadRecallData(){
  try{
    const res = await fetch(RECALL_CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    RECALL_MAP = buildRecallMap(text);
  } catch(e){
    // Non-critical: if this fails, the recall banner simply won't show.
  }
}

async function loadData(showSpinner){
  const btn = document.getElementById('refreshBtn');
  if(showSpinner) btn.classList.add('spinning');
  try{
    const res = await fetch(CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    RECORDS = buildRecordsFromCsv(text);
    localStorage.setItem(CACHE_KEY, JSON.stringify({text, ts: Date.now()}));
    setSync('Updated ' + new Date().toLocaleString());
    renderStats(); renderFilters(); renderList();
    loadRecallData();
  } catch(e){
    // fall back to cache if we have one and nothing loaded yet
    if(RECORDS.length === 0){
      const cached = localStorage.getItem(CACHE_KEY);
      if(cached){
        try{
          const {text, ts} = JSON.parse(cached);
          RECORDS = buildRecordsFromCsv(text);
          renderStats(); renderFilters(); renderList();
          loadRecallData();
          setSync('Offline — showing data from ' + new Date(ts).toLocaleString(), true);
        } catch(e2){
          setSync('Could not load data: ' + e.message, true);
          document.getElementById('listInner').innerHTML = '<div class="empty">Could not load live data. Check your connection and tap refresh.</div>';
        }
      } else {
        setSync('Could not load data: ' + e.message, true);
        document.getElementById('listInner').innerHTML = '<div class="empty">Could not load live data. Check your connection and tap refresh.</div>';
      }
    } else {
      setSync('Refresh failed: ' + e.message, true);
    }
  } finally {
    if(showSpinner) btn.classList.remove('spinning');
  }
}

const LOW_PRIORITY_LOCS = ['Nebraska', 'Unknown'];

function uniqueLocations(){
  const s = new Set();
  RECORDS.forEach(r => s.add(r.loc));
  const arr = Array.from(s).sort();
  const primary = arr.filter(l => !LOW_PRIORITY_LOCS.includes(l));
  const secondary = LOW_PRIORITY_LOCS.filter(l => arr.includes(l));
  return [...primary, ...secondary];
}

function renderStats(){
  const total = RECORDS.length;
  const activeN = RECORDS.filter(r=>r.bucket==='active').length;
  const downN = RECORDS.filter(r=>r.bucket==='active' && r.status==='down').length;
  const closedN = RECORDS.filter(r=>r.bucket==='closed').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${activeN}</div><div class="l">Active</div></div>
    <div class="stat"><div class="n" style="color:var(--red)">${downN}</div><div class="l">Down</div></div>
    <div class="stat"><div class="n">${closedN}</div><div class="l">Closed</div></div>
    <div class="stat"><div class="n">${total}</div><div class="l">Total</div></div>
  `;
}

function renderFilters(){
  const locs = uniqueLocations();
  const primaryLocs = locs.filter(l => !LOW_PRIORITY_LOCS.includes(l));
  const secondaryLocs = locs.filter(l => LOW_PRIORITY_LOCS.includes(l));

  const locChip = (l, label) => `<button class="chip ${state.loc===l?'active':''}" data-type="loc" data-val="${l}">${label || l}</button>`;
  const statusChip = (s, label) => `<button class="chip status-${s} ${state.status===s?'active':''}" data-type="status" data-val="${s}">${label}</button>`;
  const techChip = (t) => `<button class="chip ${state.tech===t?'active':''}" data-type="tech" data-val="${t}">${t}</button>`;
  const genChip = (g) => `<button class="chip gen-${g.toLowerCase()} ${state.gen===g?'active':''}" data-type="gen" data-val="${g}">${g}</button>`;

  // Single row, fixed order: All Locations, North, South, Up, Down, Emigdio, Jovanni, David, then low-priority locations last
  const chips = [
    locChip('all', 'All Locations'),
    ...primaryLocs.map(l => locChip(l)),
    statusChip('up', 'Up'),
    statusChip('down', 'Down'),
    genChip('MK3'),
    genChip('MK4'),
    techChip('Emigdio'),
    techChip('Jovanni'),
    techChip('David'),
    ...secondaryLocs.map(l => locChip(l))
  ].join('');

  document.getElementById('filters').innerHTML = `<div class="chipgroup">${chips}</div>`;
  document.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.type;
      const val = btn.dataset.val;
      // Toggle off: clicking the already-active filter resets it to "all"
      state[type] = (state[type] === val && val !== 'all') ? 'all' : val;
      renderFilters(); renderList();
    });
  });
}

function matches(r){
  if(state.seg === 'active' && r.bucket !== 'active') return false;
  if(state.seg === 'closed' && r.bucket !== 'closed') return false;
  if(state.loc !== 'all' && r.loc !== state.loc) return false;
  if(state.status !== 'all' && r.status !== state.status) return false;
  if(state.tech !== 'all' && !r.techs.includes(state.tech)) return false;
  if(state.gen !== 'all' && r.generation !== state.gen) return false;
  if(state.search){
    const q = state.search.toLowerCase();
    const hay = [r.customer, r.bus, r.caseNum, r.complaint, r.tasks, r.notes].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderNotesLog(text){
  if(!text) return '—';
  const lines = text.toString().split('\n');
  return lines.map(line => {
    if(line.indexOf('IMG::') === 0){
      const url = line.slice(5).trim();
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener"><img src="${escapeHtml(url)}" class="notephoto" loading="lazy"></a>`;
    }
    return escapeHtml(line);
  }).join('<br>');
}

function renderList(){
  const items = RECORDS.filter(matches);
  const list = document.getElementById('listInner');
  if(items.length === 0){
    list.innerHTML = '<div class="empty">No cases match your filters.</div>';
    return;
  }
  list.innerHTML = items.map((r) => {
    const idx = RECORDS.indexOf(r);
    const pillClass = r.status === 'up' ? 'up' : (r.status === 'down' ? 'down' : 'other');
    const techBadges = r.techs.map(t => `<div class="tech ${r.bucket==='closed'?'closed-tag':''}" title="${t}">${TECH_INIT[t]}</div>`).join('');
    return `<div class="card-wrap">
      <div class="card-delete-bg"><button type="button" class="card-delete-btn" data-idx="${idx}">Delete</button></div>
      <div class="card" data-idx="${idx}">
        <div class="row1">
          <div>
            <div class="idline">Case #${escapeHtml(r.caseNum)} &middot; ${escapeHtml(r.date)}</div>
            <div class="bus">${escapeHtml(r.bus)}${r.generation ? ` <span class="gentag ${r.generation.toLowerCase()}">${escapeHtml(r.generation)}</span>` : ''}</div>
          </div>
          <span class="pill ${pillClass}">${escapeHtml(r.statusLabel)}</span>
        </div>
        <div class="meta">${escapeHtml(r.customer)} &middot; ${escapeHtml(r.loc)}</div>
        <div class="complaint">${escapeHtml(r.complaint || 'No complaint logged')}</div>
        <div class="foot">
          <div class="techs">${techBadges}</div>
          <div class="miles">${escapeHtml(r.mileage)}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  const SWIPE_OPEN = -84;
  document.querySelectorAll('.card').forEach(card => {
    let startX=0, startY=0, curX=0, dragging=false, isSwipeGesture=false, startTranslate=0;
    card.addEventListener('pointerdown', (e) => {
      document.querySelectorAll('.card.swiped').forEach(c => {
        if(c !== card){ c.style.transform=''; c.classList.remove('swiped'); }
      });
      startX = e.clientX; startY = e.clientY; dragging = true; isSwipeGesture = false;
      startTranslate = card.classList.contains('swiped') ? SWIPE_OPEN : 0;
      curX = startTranslate;
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if(!isSwipeGesture){
        if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) isSwipeGesture = true;
        else if(Math.abs(dy) > 8){ dragging = false; return; }
      }
      if(isSwipeGesture){
        curX = Math.max(SWIPE_OPEN, Math.min(0, startTranslate + dx));
        card.style.transform = `translateX(${curX}px)`;
      }
    });
    const endDrag = () => {
      if(!dragging) return;
      dragging = false;
      card.style.transition = '';
      if(isSwipeGesture){
        if(curX < SWIPE_OPEN/2){
          card.style.transform = `translateX(${SWIPE_OPEN}px)`;
          card.classList.add('swiped');
        } else {
          card.style.transform = '';
          card.classList.remove('swiped');
        }
      }
    };
    card.addEventListener('pointerup', endDrag);
    card.addEventListener('pointercancel', endDrag);
    card.addEventListener('click', () => {
      if(isSwipeGesture || card.classList.contains('swiped')){
        if(card.classList.contains('swiped')){
          card.style.transform = '';
          card.classList.remove('swiped');
        }
        isSwipeGesture = false;
        return;
      }
      openSheet(RECORDS[parseInt(card.dataset.idx)]);
    });
  });

  document.querySelectorAll('.card-delete-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const r = RECORDS[parseInt(btn.dataset.idx, 10)];
      if(!r) return;
      if(!confirm(`Delete case #${r.caseNum} (${r.bus})? This cannot be undone.`)) return;
      deleteCase(r);
    });
  });
}

async function deleteCase(r){
  try{
    const res = await postToApi({ action: 'deleteCase', rowIndex: r.sheetRow, caseNum: r.caseNum });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Unknown error');
    const idx = RECORDS.indexOf(r);
    if(idx > -1) RECORDS.splice(idx, 1);
    renderStats(); renderList();
  } catch(e){
    alert('Could not delete case: ' + e.message);
  }
}

let CURRENT_RECORD = null;
let SELECTED_PHOTOS = [];
let AI_CONVERSATION = [];
let AI_BUSY = false;

function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 1600;
  quality = quality || 0.8;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPhotoPreview(){
  const el = document.getElementById('photoPreview');
  if(!el) return;
  el.innerHTML = SELECTED_PHOTOS.map((p, i) => `
    <div class="photothumb">
      <img src="data:${p.mimeType};base64,${p.data}">
      <button type="button" class="photoremove" data-idx="${i}">&#10005;</button>
    </div>
  `).join('');
  el.querySelectorAll('.photoremove').forEach(btn => {
    btn.addEventListener('click', () => {
      SELECTED_PHOTOS.splice(parseInt(btn.dataset.idx, 10), 1);
      renderPhotoPreview();
    });
  });
}

async function handlePhotoInput(e){
  const files = Array.from(e.target.files || []);
  for(const file of files){
    try{
      const dataUrl = await resizeImageFile(file);
      const match = dataUrl.match(/^data:(.*?);base64,(.*)$/);
      if(match){
        SELECTED_PHOTOS.push({ name: file.name || 'photo.jpg', mimeType: match[1], data: match[2] });
      }
    } catch(err){ /* skip photo that failed to load/resize */ }
  }
  renderPhotoPreview();
  e.target.value = '';
}

function aiTruncate(s, n){
  s = (s || '').toString();
  return s.length > n ? s.slice(0, n) + '\u2026' : s;
}

function buildAiContext(r){
  const lines = [];
  lines.push(`Bus: ${r.bus}${r.generation ? ' ('+r.generation+')' : ''}`);
  lines.push(`Case #${r.caseNum} \u2014 ${r.statusLabel}, ${r.bucket === 'closed' ? 'Closed' : 'Active'}${r.caseStatus ? ' ('+r.caseStatus+')' : ''}`);
  if(r.customer || r.loc) lines.push(`Location: ${[r.customer, r.loc].filter(Boolean).join(' \u00b7 ')}`);
  if(r.mileage) lines.push(`Mileage: ${r.mileage}`);
  lines.push(`Initial complaint: ${r.complaint || '(none logged)'}`);
  if(r.tasks) lines.push(`Tasks: ${r.tasks}`);
  const sw = [
    r.swInternal ? `Internal ${r.swInternal}` : '',
    r.swFront ? `Front ${r.swFront}` : '',
    r.swRear ? `Rear ${r.swRear}` : '',
    r.swScreen ? `Screen ${r.swScreen}` : '',
    r.swBuild ? `Build ${r.swBuild}` : ''
  ].filter(Boolean).join(', ');
  if(sw) lines.push(`Software versions: ${sw}`);
  if(r.telemetryStatus) lines.push(`Telemetry: ${r.telemetryStatus}${r.lastTelemetry ? ' (last contact '+r.lastTelemetry+')' : ''}`);
  if(r.bucket === 'closed'){
    const res = [r.subAssembly, r.symptom, r.component, r.solution, r.rootCause].filter(Boolean).join(' / ');
    if(res) lines.push(`Resolution on file: ${res}`);
  }
  if(r.notes){
    const cleanNotes = r.notes.toString().split('\n').filter(l => l.indexOf('IMG::') !== 0).join('\n');
    if(cleanNotes) lines.push(`Update log:\n${aiTruncate(cleanNotes, 1500)}`);
  }
  const history = RECORDS.filter(x => x.bus === r.bus && x !== r)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
    .slice(0, 8);
  if(history.length){
    lines.push('Prior cases on record for this bus:');
    history.forEach(h => {
      const res = [h.subAssembly, h.symptom, h.component, h.solution, h.rootCause].filter(Boolean).join(' / ');
      lines.push(`- [${h.date}] Case #${h.caseNum} (${h.bucket}): ${aiTruncate(h.complaint, 200)}${res ? ' \u2192 ' + res : ''}`);
    });
  } else {
    lines.push('No prior cases on record for this bus.');
  }
  return aiTruncate(lines.join('\n'), 6000);
}

function renderAiLog(){
  const log = document.getElementById('aiLog');
  if(!log) return;
  if(AI_CONVERSATION.length === 0){
    log.innerHTML = '<div class="ai-empty">Ask Jean-Miel to analyze this case, or ask him a question about the bus\'s history.</div>';
    return;
  }
  log.innerHTML = AI_CONVERSATION.map(m => {
    if(m.role === 'loading') return '<div class="ai-msg loading">Jean-Miel is thinking\u2026</div>';
    return `<div class="ai-msg ${m.role}">${escapeHtml(m.text)}</div>`;
  }).join('');
  log.scrollTop = log.scrollHeight;
}

async function aiRequest(r, question){
  if(AI_BUSY) return;
  AI_BUSY = true;
  const analyzeBtn = document.getElementById('aiAnalyzeBtn');
  const askBtn = document.getElementById('aiAskBtn');
  const msgEl = document.getElementById('aiMsg');
  analyzeBtn.disabled = true;
  askBtn.disabled = true;
  msgEl.textContent = '';
  msgEl.className = 'notemsg';
  AI_CONVERSATION.push({ role: 'user', text: question });
  AI_CONVERSATION.push({ role: 'loading' });
  renderAiLog();
  try{
    const context = buildAiContext(r);
    const messages = AI_CONVERSATION.filter(m => m.role === 'user' || m.role === 'assistant');
    const res = await postToApi({ action: 'aiAsk', rowIndex: r.sheetRow, caseNum: r.caseNum, context, messages });
    const data = await res.json();
    AI_CONVERSATION = AI_CONVERSATION.filter(m => m.role !== 'loading');
    if(!data.ok) throw new Error(data.error || 'Unknown error');
    AI_CONVERSATION.push({ role: 'assistant', text: data.answer || '(no response)' });
    renderAiLog();
  } catch(e){
    AI_CONVERSATION = AI_CONVERSATION.filter(m => m.role !== 'loading');
    renderAiLog();
    msgEl.textContent = 'Jean-Miel request failed: ' + e.message;
    msgEl.className = 'notemsg err';
  } finally {
    AI_BUSY = false;
    analyzeBtn.disabled = false;
    askBtn.disabled = false;
  }
}

function initCombo(inputId, listId, options){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if(!input || !list) return;
  const MAX_SHOWN = 60;
  function render(){
    const q = input.value.trim().toLowerCase();
    const matches = (q ? options.filter(o => o.toLowerCase().includes(q)) : options).slice(0, MAX_SHOWN);
    if(!matches.length){
      list.innerHTML = '<div class="combo-item empty">No matches</div>';
    } else {
      list.innerHTML = matches.map(o => `<div class="combo-item" data-val="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join('');
    }
    list.classList.add('show');
  }
  input.addEventListener('focus', render);
  input.addEventListener('input', render);
  input.addEventListener('blur', () => setTimeout(() => list.classList.remove('show'), 150));
  list.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.combo-item[data-val]');
    if(!item) return;
    e.preventDefault();
    input.value = item.getAttribute('data-val');
    list.classList.remove('show');
  });
}

async function submitRecallConfirm(r){
  const btn = document.getElementById('confirmRecallBtn');
  const msgEl = document.getElementById('recallMsg');
  const versionEl = document.getElementById('recallVersionSelect');
  const version = versionEl.value;
  if(!version){
    msgEl.textContent = 'Please select a version.';
    msgEl.className = 'notemsg err';
    return;
  }
  btn.disabled = true;
  msgEl.textContent = 'Sending…';
  msgEl.className = 'notemsg';
  try{
    const res = await postToApi({ action: 'psRecall', bus: r.bus, version });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Unknown error');
    if(RECALL_MAP[r.bus]) RECALL_MAP[r.bus].done = true;
    const banner = document.getElementById('recallBanner');
    if(banner) banner.remove();
  } catch(e){
    msgEl.textContent = 'Failed: ' + e.message;
    msgEl.className = 'notemsg err';
    btn.disabled = false;
  }
}

async function submitStatus(){
  const r = CURRENT_RECORD;
  if(!r) return;
  const statusEl = document.getElementById('statusSelect');
  const bucketEl = document.getElementById('bucketSelect');
  const caseStatusEl = document.getElementById('caseStatusInput');
  const customerEl = document.getElementById('customerInput');
  const tasksEl = document.getElementById('tasksInput');
  const subAssemblyEl = document.getElementById('subAssemblySelect');
  const symptomEl = document.getElementById('symptomInput');
  const componentEl = document.getElementById('componentInput');
  const solutionEl = document.getElementById('solutionSelect');
  const rootCauseEl = document.getElementById('rootCauseInput');
  const msgEl = document.getElementById('statusMsg');
  const btn = document.getElementById('saveStatusBtn');
  const status = statusEl.value;
  const bucket = bucketEl.value;
  const caseStatus = caseStatusEl.value.trim();
  const customer = customerEl.value.trim();
  const tasks = tasksEl.value.trim();
  const subAssembly = subAssemblyEl.value;
  const symptom = symptomEl.value.trim();
  const component = componentEl.value.trim();
  const solution = solutionEl.value;
  const rootCause = rootCauseEl.value.trim();
  const emigdio = document.getElementById('techEmigdio').checked;
  const david = document.getElementById('techDavid').checked;
  const jovanni = document.getElementById('techJovanni').checked;
  if(bucket === 'Closed'){
    const recall = RECALL_MAP[r.bus];
    if(recall && recall.done === false){
      msgEl.textContent = 'Power Steering recall must be confirmed before this case can be closed (see banner above).';
      msgEl.className = 'notemsg err';
      const banner = document.getElementById('recallBanner');
      if(banner) banner.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
  }
  btn.disabled = true;
  msgEl.textContent = 'Saving…';
  msgEl.className = 'notemsg';
  try{
    const res = await postToApi({ action: 'status', rowIndex: r.sheetRow, caseNum: r.caseNum, status, bucket, caseStatus,
      customer, tasks, subAssembly, symptom, component, solution, rootCause, emigdio, david, jovanni });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Unknown error');
    r.status = status.toLowerCase();
    r.statusLabel = status;
    r.bucket = bucket.toLowerCase();
    r.caseStatus = caseStatus;
    r.customer = customer || 'Unknown';
    document.getElementById('sheetSub').textContent = `Case #${r.caseNum} · ${r.customer} · ${r.date}`;
    r.tasks = tasks;
    r.subAssembly = subAssembly;
    r.symptom = symptom;
    r.component = component;
    r.solution = solution;
    r.rootCause = rootCause;
    r.techs = TECHS.filter(t => ({Emigdio:emigdio, David:david, Jovanni:jovanni})[t]);
    msgEl.textContent = 'Saved.';
    msgEl.className = 'notemsg ok';
    loadData(false);
  } catch(e){
    msgEl.textContent = 'Failed: ' + e.message;
    msgEl.className = 'notemsg err';
  } finally {
    btn.disabled = false;
  }
}

async function submitNewCase(){
  const bus = document.getElementById('ncBus').value.trim();
  const customer = document.getElementById('ncCustomer').value.trim();
  const caseNum = document.getElementById('ncCase').value.trim();
  const etLocation = document.getElementById('ncLoc').value.trim();
  const status = document.getElementById('ncStatus').value;
  const emigdio = document.getElementById('ncEmigdio').checked;
  const david = document.getElementById('ncDavid').checked;
  const jovanni = document.getElementById('ncJovanni').checked;
  const complaint = document.getElementById('ncComplaint').value.trim();
  const tasks = document.getElementById('ncTasks').value.trim();
  const mileage = document.getElementById('ncMileage').value.trim();
  const msgEl = document.getElementById('ncMsg');
  const btn = document.getElementById('createCaseBtn');

  if(!bus && !customer){
    msgEl.textContent = 'Bus # or Customer is required.';
    msgEl.className = 'formmsg err';
    return;
  }

  btn.disabled = true;
  msgEl.textContent = 'Creating…';
  msgEl.className = 'formmsg';
  try{
    const res = await postToApi({
      action: 'newCase', bus, customer, caseNum, etLocation, status,
      emigdio, david, jovanni, complaint, tasks, mileage
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Unknown error');
    msgEl.textContent = 'Case created.';
    msgEl.className = 'formmsg ok';
    await loadData(false);
    setTimeout(closeSheet, 700);
  } catch(e){
    msgEl.textContent = 'Failed: ' + e.message;
    msgEl.className = 'formmsg err';
  } finally {
    btn.disabled = false;
  }
}

async function submitNote(){
  const r = CURRENT_RECORD;
  if(!r) return;
  const authorEl = document.getElementById('noteAuthor');
  const textEl = document.getElementById('noteText');
  const msgEl = document.getElementById('noteMsg');
  const btn = document.getElementById('addNoteBtn');
  const author = authorEl.value.trim();
  const note = textEl.value.trim();
  if(!note && SELECTED_PHOTOS.length === 0){
    msgEl.textContent = 'Write something or attach a photo first.';
    msgEl.className = 'notemsg err';
    return;
  }
  localStorage.setItem(AUTHOR_KEY, author);
  btn.disabled = true;
  msgEl.textContent = SELECTED_PHOTOS.length ? 'Uploading…' : 'Sending…';
  msgEl.className = 'notemsg';
  try{
    const res = await postToApi({ rowIndex: r.sheetRow, caseNum: r.caseNum, note: note || '(photo)', author, photos: SELECTED_PHOTOS });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Unknown error');
    // Optimistically update in-memory + on-screen log
    r.notes = data.updated;
    document.getElementById('notesLog').innerHTML = renderNotesLog(r.notes);
    textEl.value = '';
    SELECTED_PHOTOS = [];
    renderPhotoPreview();
    msgEl.textContent = 'Note added.';
    msgEl.className = 'notemsg ok';
    // Background refresh so list stays in sync with the sheet
    loadData(false);
  } catch(e){
    msgEl.textContent = 'Failed: ' + e.message;
    msgEl.className = 'notemsg err';
  } finally {
    btn.disabled = false;
  }
}

// Pull-to-refresh: swipe down while at the top of the case list to refresh.
(function initPullToRefresh(){
  const main = document.getElementById('list');
  const indicator = document.getElementById('pullIndicator');
  const pullText = document.getElementById('pullText');
  const THRESHOLD = 64;
  const MAX_PULL = 90;
  let startX = 0, startY = 0, pulling = false, armed = false, refreshing = false;

  main.addEventListener('touchstart', (e) => {
    if(refreshing || e.touches.length !== 1) { pulling = false; return; }
    if(main.scrollTop <= 0){
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      pulling = true;
    } else {
      pulling = false;
    }
  }, {passive:true});

  main.addEventListener('touchmove', (e) => {
    if(!pulling || refreshing) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0 || Math.abs(dx) > dy || main.scrollTop > 0){ pulling = false; indicator.style.height = '0px'; return; }
    const pull = Math.min(dy * 0.5, MAX_PULL);
    indicator.style.height = pull + 'px';
    const shouldArm = pull > THRESHOLD;
    if(shouldArm !== armed){
      armed = shouldArm;
      indicator.classList.toggle('armed', armed);
      pullText.textContent = armed ? 'Release to refresh' : 'Pull to refresh';
    }
    e.preventDefault();
  }, {passive:false});

  main.addEventListener('touchend', () => {
    if(!pulling || refreshing){ pulling = false; return; }
    pulling = false;
    if(armed){
      refreshing = true;
      indicator.classList.add('refreshing');
      indicator.classList.remove('armed');
      pullText.textContent = 'Refreshing…';
      indicator.style.height = '48px';
      checkForUpdate();
      loadData(true).finally(() => {
        indicator.style.height = '0px';
        indicator.classList.remove('refreshing');
        pullText.textContent = 'Pull to refresh';
        refreshing = false;
      });
    } else {
      indicator.style.height = '0px';
    }
    armed = false;
  });
})();
